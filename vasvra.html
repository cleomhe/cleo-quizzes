  :root{--bg:#fdf6e9;--ink:#2b2b2b;--card:#fff;--accent:#2f6f4e;--good:#2e7d32;--bad:#b3541e;--line:#e0d6c2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.4}
  .wrap{max-width:640px;margin:0 auto;padding:16px}

  .sub{text-align:center;color:#555;font-size:20px;margin-bottom:18px}

  button{font:inherit;font-size:24px;width:100%;padding:16px;margin:8px 0;border-radius:14px;border:3px solid var(--accent);background:#fff;color:var(--ink);text-align:left;cursor:pointer}

  button.opt:active{background:#eef6f0}
  button.right{background:#dff3e0;border-color:var(--good)}
  button.wrong{background:#fbe5d6;border-color:var(--bad)}
  button:disabled{opacity:1}
  .cat{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
  .cat label{display:flex;align-items:center;gap:8px;font-size:22px;background:#f4ecd9;padding:10px 14px;border-radius:12px}
  .cat input{width:26px;height:26px}
  .top{display:flex;justify-content:space-between;font-size:20px;color:#555;margin-bottom:8px}
  .q{font-size:28px;font-weight:bold;margin:6px 0 10px}
  .fb{font-size:26px;margin:12px 0;font-weight:bold}
  .fb.g{color:var(--good)} .fb.b{color:var(--bad)}
  .big{font-size:56px;text-align:center;margin:8px 0}
  .small{font-size:19px;color:#555}
  table{width:100%;border-collapse:collapse;font-size:20px} td{padding:6px 4px;border-bottom:1px solid var(--line)}
</style>
</head>

const KATS = ["Rekenkunde","Geskiedenis","Aardrykskunde","Algemeen","Spreekwoorde","Natuur","Bybel","Kos en Kook","Woorde","Sport en Musiek"];
const WEB3FORMS_KEY = "2e1d3de6-f101-4465-bf9f-840e9de848c5"; // stuur elke rondte se punte per e-pos (die sleutel is nie geheim nie)
const RONDE = 10;
const app = document.getElementById("app");
let rond, idx, punte, t0, gekies, foute;

function lees(){ try{return JSON.parse(localStorage.getItem("vasvra")||"[]")}catch(e){return[]} }
function skryf(r){ try{const h=lees();h.unshift(r);localStorage.setItem("vasvra",JSON.stringify(h.slice(0,10)))}catch(e){} }
function skud(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function tuis(){
  const h = lees();
  let geskiedenis = "";
  if(h.length){
    geskiedenis = '<div class="card"><b>Jou vorige rondtes</b><table>' +
      h.slice(0,5).map(r=>`<tr><td>${esc(r.datum)}</td><td>${r.punte} van ${r.van}</td><td>${r.tyd}</td></tr>`).join("") +
      '</table></div>';
  }
  app.innerHTML = `
   <h1>Ma se Vasvra</h1>
   <div class="sub">Neem jou tyd, daar is geen haas nie 😊</div>
   <div class="card">
     <b>Waaroor wil jy vrae hê?</b>
     <div class="cat">${KATS.map(k=>`<label><input type="checkbox" value="${k}" checked> ${k}</label>`).join("")}</div>
     <button class="main" onclick="begin()">Begin! (${RONDE} vrae)</button>
   </div>${geskiedenis}
   <div class="small" style="text-align:center">${VRAE.length} vrae in totaal</div>`;
}

function begin(){
  const gekiesK=[...document.querySelectorAll(".cat input:checked")].map(i=>i.value);
  let poel=VRAE.filter(v=>gekiesK.includes(v[0]));
  if(!poel.length) poel=VRAE;
  let gesien=[]; try{gesien=JSON.parse(localStorage.getItem("vasvra_gesien")||"[]")}catch(e){}
  let vars=poel.filter(v=>!gesien.includes(v[1]));
  if(vars.length<RONDE){ gesien=gesien.filter(g=>!poel.some(v=>v[1]===g)); vars=poel; } // alles gesien: begin weer van voor af
  rond=skud(vars).slice(0,RONDE);
  try{localStorage.setItem("vasvra_gesien",JSON.stringify(gesien.concat(rond.map(v=>v[1]))))}catch(e){}
  rond=rond.map(v=>{
    const regte=v[2][v[3]]; const opsies=skud(v[2]);
    return {kat:v[0],vraag:v[1],opsies,regte,wenk:v[4]};
  });
  idx=0; punte=0; foute=[]; t0=Date.now(); vraag();
}

function vraag(){
  gekies=false;
  const v=rond[idx];
  app.innerHTML = `
   <div class="top"><span>Vraag ${idx+1} van ${rond.length}</span><span>${esc(v.kat)}</span></div>
   <div class="card">
     <div class="q">${esc(v.vraag)}</div>
     ${v.opsies.map((o,i)=>`<button class="opt" onclick="kies(${i})">${esc(o)}</button>`).join("")}
     <div id="fb"></div>
   </div>`;
}

function kies(i){
  if(gekies) return; gekies=true;
  const v=rond[idx]; const knoppies=document.querySelectorAll("button.opt");
  const reg = v.opsies[i]===v.regte;
  if(reg) punte++; else foute.push(v.vraag+" -> sy het gekies: "+v.opsies[i]+" (reg: "+v.regte+")");
  knoppies.forEach((b,j)=>{ b.disabled=true; if(v.opsies[j]===v.regte) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  const fb=document.getElementById("fb");
  fb.innerHTML = (reg
     ? `<div class="fb g">✔ Reg! Mooi so!</div>`
     : `<div class="fb b">Amper! Die regte antwoord is: ${esc(v.regte)}</div>`)
     + `<div class="small">${esc(v.wenk||"")}</div>`
     + `<button class="main" onclick="volgende()">${idx+1<rond.length?"Volgende vraag":"Sien my punte"}</button>`;
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function volgende(){ idx++; if(idx<rond.length) vraag(); else einde(); }

function einde(){
  const sek=Math.round((Date.now()-t0)/1000);
  const tyd=Math.floor(sek/60)+" min "+(sek%60)+" sek";
  const d=new Date(); const datum=d.getDate()+"/"+(d.getMonth()+1)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  skryf({datum,punte,van:rond.length,tyd});
  stuur(datum,tyd);
  const p=punte/rond.length;
  const boodskap = p===1?"Perfek! Wonderlik!":p>=0.7?"Baie goed gedoen!":p>=0.4?"Goed so, probeer weer!":"Dit was 'n goeie probeerslag. Probeer weer, dit word makliker!";
  app.innerHTML = `
   <h1>Klaar!</h1>
   <div class="card">
     <div class="big">${punte} / ${rond.length}</div>
     <div class="sub" style="font-size:26px">${boodskap}</div>
     <div class="sub">Tyd: ${tyd}</div>
     <button class="main" onclick="begin2()">Nog 'n rondte</button>
     <button onclick="tuis()">Terug na die begin</button>
   </div>`;
}
function stuur(datum,tyd){
  try{
    const kats=[...new Set(rond.map(v=>v.kat))].join(", ");
    fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"Ma se Vasvra - "+punte+"/"+rond.length+" - "+tyd,
        from_name:"Ma se Vasvra",Punte:punte+" van "+rond.length,Tyd:tyd,Datum:datum,Onderwerpe:kats,
        Foute:foute.length?foute.join(" | "):"Almal reg!"})}).catch(function(){});
  }catch(e){}
}
function begin2(){ tuis(); begin(); }

tuis();
</script>
